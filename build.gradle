subprojects {
    plugins.withId('java') {
        // Gradle 9 no longer injects the JUnit platform launcher, and it treats
        // test sources without discoverable tests as an error.
        dependencies {
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
    }
    tasks.withType(Test).configureEach {
        failOnNoDiscoveredTests = false
    }
}
