name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The Gradle 5.6.1 wrapper does not support Java 17.
          java-version: "11"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: sh gradlew build --no-daemon
